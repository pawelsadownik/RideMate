name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ridemate
          POSTGRES_PASSWORD: ridemate
          POSTGRES_DB: ridemate_test
        ports:
          - "5434:5432"
        options: >-
          --health-cmd "pg_isready -U ridemate -d ridemate_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build backend
        run: dotnet build backend/RideMate.sln --nologo

      - name: Test backend (unit + integration)
        run: |
          dotnet test backend/tests/RideMate.Domain.Tests/RideMate.Domain.Tests.csproj --nologo
          dotnet test backend/tests/RideMate.Api.Tests/RideMate.Api.Tests.csproj --nologo
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5434;Database=ridemate_test;Username=ridemate;Password=ridemate
          ASPNETCORE_ENVIRONMENT: Development
          Jwt__Key: test-key-32-chars-long-1234567890
          App__DevMode: "true"

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json

      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci

      - name: TypeScript typecheck
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run mobile tests
        working-directory: mobile
        run: npm test

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker Compose config
        run: docker compose config --quiet
