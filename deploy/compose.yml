name: ridemate
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ridemate
      POSTGRES_USER: ridemate
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deploy/.env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ridemate -d ridemate"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [private]
  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Staging
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=ridemate;Username=ridemate;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY in deploy/.env}
      Jwt__Issuer: RideMate
      Jwt__Audience: RideMateApp
      Jwt__ExpiresInMinutes: "120"
      Database__Provider: PostgreSQL
      Demo__Enabled: "false"
      App__DevMode: "false"
    ports:
      - "127.0.0.1:${API_PORT:-8050}:8080"
    networks: [private]
networks:
  private:
volumes:
  database:
